name: Build rtl_433 app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rtl433-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.config.outputs.version }}
      architectures: ${{ steps.config.outputs.architectures }}
      registry: ${{ steps.config.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
      - name: Read app configuration
        id: config
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(jq -r '.version' rtl_433/config.json)
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "$version" ]]; then
            echo "::error::Release tag must match config.json version ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "architectures=$(jq -c '.arch' rtl_433/config.json)" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Prepare native build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.config.outputs.architectures }}
          image-name: rtl_433-upd
          registry-prefix: ${{ steps.config.outputs.registry }}

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Check runtime script
        run: |
          bash -n rtl_433/run.sh
          python3 -m unittest discover -s tests -v
      - name: Build and optionally publish image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: rtl_433
          image: ${{ matrix.image }}
          version: ${{ needs.prepare.outputs.version }}
          image-tags: ${{ needs.prepare.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name == 'release' }}
          cosign: ${{ github.event_name == 'release' }}
          load: "true"
      - name: Check binary and runtime libraries
        env:
          IMAGE: ${{ matrix.image }}:${{ needs.prepare.outputs.version }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            rtl_433 -V
            ! ldd /usr/local/bin/rtl_433 2>&1 | grep -E "not found|Error loading|Error relocating"
            SoapySDRUtil --info 2>&1 | tee /tmp/soapy-info
            grep -q hackrf /tmp/soapy-info
          '

  manifest:
    if: github.event_name == 'release'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Publish signed multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          registry-prefix: ${{ needs.prepare.outputs.registry }}
          image-name: rtl_433-upd
          image-tags: ${{ needs.prepare.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
